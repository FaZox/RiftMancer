apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Version from package.json: "1.2.3" → versionName "1.2.3", versionCode 10203.
def pkg = new JsonSlurper().parse(rootProject.file('../package.json'))
def (vMajor, vMinor, vPatch) = (pkg.version.tokenize('.') + ['0', '0', '0']).take(3).collect { it.replaceAll('[^0-9]', '') as int }
def appVersionCode = vMajor * 10000 + vMinor * 100 + vPatch
def appVersionName = pkg.version

// Release signing: android/keystore.properties (git-ignored) or environment
// variables RB_KEYSTORE / RB_KEYSTORE_PASSWORD / RB_KEY_ALIAS / RB_KEY_PASSWORD.
// See README « APK signé (release) ». Never commit the keystore.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = signValue('storeFile', 'RB_KEYSTORE')

android {
    namespace = "com.riftmancer.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.riftmancer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two apps side by side: « RiftMancer » (every day) and
    // « RiftMancer Test » (com.riftmancer.app.test, own data and pairing).
    flavorDimensions = ["variant"]
    productFlavors {
        daily {
            dimension "variant"
            manifestPlaceholders = [appLabel: "RiftMancer"]
        }
        // (Gradle forbids flavor names starting with « test »)
        beta {
            dimension "variant"
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [appLabel: "RiftMancer Test"]
        }
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword signValue('storePassword', 'RB_KEYSTORE_PASSWORD')
                keyAlias signValue('keyAlias', 'RB_KEY_ALIAS')
                keyPassword signValue('keyPassword', 'RB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
